name: Build and Deploy P2 Update Site

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven Tycho
        run: |
          mvn clean verify -Dtycho.localArtifacts=ignore

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repositories/com.github.vvi3ard.dt.linkifier.repository/target/repository
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false

      - name: Locate Repository Zip
        id: locate_zip
        run: |
          ZIP_FILE=$(ls repositories/com.github.vvi3ard.dt.linkifier.repository/target/*.zip | head -n 1)
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2-update-site
          path: ${{ steps.locate_zip.outputs.zip_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_zip.outputs.zip_path }}
          generate_release_notes: true
